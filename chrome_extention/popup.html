<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <style>
        body {
            width: 320px;
            padding: 20px;
            font-family: Arial, sans-serif;
            transition: background-color 0.3s ease;
        }
        h1 {
            color: #333;
            font-size: 18px;
            margin: 0 0 15px 0;
            text-align: center;
        }
        .button-group {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 15px;
        }
        button {
            background-color: #4CAF50;
            color: white;
            padding: 12px 16px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            transition: background-color 0.2s ease;
        }
        button:hover {
            background-color: #45a049;
        }
        #randomBtn {
            background-color: #2196F3;
        }
        #randomBtn:hover {
            background-color: #1976D2;
        }
        #timeBtn {
            background-color: #FF9800;
        }
        #timeBtn:hover {
            background-color: #F57C00;
        }
        #counter {
            font-weight: bold;
            color: #333;
            text-align: center;
            margin: 10px 0;
        }
        #message {
            color: #666;
            font-size: 14px;
            text-align: center;
            min-height: 20px;
            margin-top: 15px;
            transition: color 0.3s ease;
        }
    </style>
</head>
<body>
    <h1>Interactive Extension</h1>
    
    <div class="button-group">
        <button id="clickBtn">クリックカウンター</button>
        <button id="randomBtn">背景色をランダムに変更</button>
        <button id="timeBtn">現在時刻を表示</button>
    </div>
    
    <div id="counter">クリック回数: 0</div>
    <div id="message"></div>

    <script src="popup.js"></script>
</body>
</html>
